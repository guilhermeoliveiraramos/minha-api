name: Deploy na instancia AWS EC2

on:
  workflow_run:
    workflows: ["Builds and Tests"]
    types:
      - completed

jobs:
  Deploy:
    name: Implantação AWS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
               script: |
        # Faz pull da SUA nova imagem do Docker Hub
        sudo docker pull docker.io/guilhermeoliveiraramos/minha-api:latest
        
        # Para e remove o container antigo (se existir)
        sudo docker stop senai_fastapi 2>/dev/null || true
        sudo docker rm senai_fastapi 2>/dev/null || true
        
        # Sobe o novo container mapeado na porta 8080
        sudo docker run -d \
          --name senai_fastapi \
          --restart unless-stopped \
          -p 8080:8080 \
          guilhermeoliveiraramos/minha-api:latest
          
        # Health check pós-deploy
        sleep 5
        curl -f http://localhost:8080/health || exit 1
        echo "✅ Deploy concluído com sucesso!"
        
        # Remove imagens antigas para economizar espaço
        sudo docker image prune -f
